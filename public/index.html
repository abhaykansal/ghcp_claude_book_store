<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Management - Add Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Library Book Management</h1>
            <nav>
                <a href="/" class="nav-link active">Add Book</a>
                <a href="/search" class="nav-link">Search Books</a>
            </nav>
        </header>

        <main>
            <section class="add-book-section">
                <h2>Add New Book</h2>
                <form id="addBookForm" class="book-form">
                    <div class="form-group">
                        <label for="bookName">Book Name *</label>
                        <input type="text" id="bookName" name="bookName" placeholder="Enter book name" required maxlength="255" />
                    </div>

                    <div class="form-group">
                        <label for="authorName">Author Name *</label>
                        <input type="text" id="authorName" name="authorName" placeholder="Enter author name" required maxlength="255" />
                    </div>

                    <div class="form-group">
                        <label for="isbn">ISBN *</label>
                        <input type="text" id="isbn" name="isbn" placeholder="Enter ISBN-10 or ISBN-13" required />
                    </div>

                    <div class="form-group">
                        <label for="publicationYear">Publication Year *</label>
                        <input type="number" id="publicationYear" name="publicationYear" placeholder="Enter four-digit year" required min="1000" max="9999" step="1" />
                    </div>

                    <div class="form-group">
                        <label for="genre">Genre *</label>
                        <select id="genre" name="genre" required disabled>
                            <option value="">Loading genres...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="publisher">Publisher *</label>
                        <input type="text" id="publisher" name="publisher" placeholder="Enter publisher" required maxlength="255" />
                    </div>

                    <div class="form-group">
                        <label for="totalCopies">Total Copies *</label>
                        <input type="number" id="totalCopies" name="totalCopies" placeholder="Enter total copies" required min="1" step="1" />
                    </div>

                    <div class="form-group">
                        <label for="availableCopies">Available Copies *</label>
                        <input type="number" id="availableCopies" name="availableCopies" placeholder="Enter available copies" required min="0" step="1" />
                    </div>

                    <button type="submit" class="btn btn-primary">Add Book</button>
                    <button type="reset" class="btn btn-secondary">Reset</button>
                </form>

                <div id="messageArea" class="message-area hidden">
                    <div id="messageContent" class="message-content"></div>
                    <button type="button" class="btn btn-small btn-secondary" onclick="clearMessage()">
                        Clear
                    </button>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Library Book Management System</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
